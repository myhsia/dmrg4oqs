name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax (compileall)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Byte-compile the sources
        run: python -m compileall -q -x '(^|[/\\])output([/\\]|$)' source

  build_env:
    name: Build environment (conda)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the dmrg environment
        uses: ./.github/actions/dmrg-env
        with:
          build: "true"

  validation:
    name: tDMRG regression suite
    needs: build_env
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the dmrg environment
        uses: ./.github/actions/dmrg-env

      - name: tDMRG regression suite
        working-directory: source
        run: |
          conda activate dmrg
          python library/dmrg/validation.py

  heom:
    name: HEOM import
    needs: build_env
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the dmrg environment
        uses: ./.github/actions/dmrg-env

      - name: Import HEOM
        working-directory: source
        run: |
          conda activate dmrg
          python -c "import heom; print('heom import OK')"
